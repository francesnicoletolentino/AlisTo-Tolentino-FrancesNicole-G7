
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AlisTo</title>
</head>
<body>

    <h1>Create Your AlisTo Account</h1>
    <p>Register to access the student safety system.</p>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

    <p>Already have an account?
        <a href="#">Log in</a>
    </p>

</body>
</html>
